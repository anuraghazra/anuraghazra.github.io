<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anurag's Workstation</title>
    <script type="module" crossorigin src="/uses/assets/index-DsceWg6L.js"></script>
    <link rel="stylesheet" crossorigin href="/uses/assets/index-BVg6Gxec.css">
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loader"><span id="progress">Loading 0%</span></div>
    <aside id="panel">
      <h1>H6 Flow Desk Setup</h1>
      <p class="hint">Drag to orbit, scroll to zoom, right-drag to pan. Click any part to focus it.</p>
      <div class="row" id="views"></div>
      <div class="row">
        <button id="explodePc" aria-pressed="false" title="Explode PC (E)" aria-keyshortcuts="E">Explode PC</button>
        <button id="explodeKb" aria-pressed="false" title="Explode keyboard (K)" aria-keyshortcuts="K">Explode keyboard</button>
        <button id="hammer" aria-pressed="false" title="Hammer (H)" aria-keyshortcuts="H">Hammer</button>
        <button id="fire" aria-pressed="false" title="Fire (F)" aria-keyshortcuts="F">Fire</button>
        <button id="block" aria-pressed="false" title="Steel ball (B)" aria-keyshortcuts="B">Steel ball</button>
        <button id="press" aria-pressed="false" title="Hydraulic press (P), then P to crush or pause" aria-keyshortcuts="P">Hydraulic press</button>
        <button id="render" aria-pressed="false" title="Render (C)" aria-keyshortcuts="C">Render</button>
      </div>
      <p class="hint" id="status" role="status"></p>
    </aside>
    <aside id="bill" aria-label="Damage bill" hidden>
      <div class="billHead">
        <h2>Damage bill</h2>
        <div class="seg billCurrency" role="group" aria-label="Currency">
          <button data-currency="USD" aria-pressed="true" title="US dollars">$</button>
          <button data-currency="INR" aria-pressed="false" title="Indian rupees">₹</button>
        </div>
      </div>
      <ol></ol>
      <p class="billTotal"><span>Total</span><button id="repair" hidden title="Repair (R)" aria-keyshortcuts="R"><span class="billVerb">Repair</span> <output aria-live="polite"></output></button></p>
    </aside>
    <section id="pressPanel" aria-label="Hydraulic press" hidden>
      <div class="pressRow"><span>Direction</span><div class="seg" data-option="axis"><button data-value="top">Top</button><button data-value="side">Side</button></div></div>
      <div class="pressRow"><span>Head</span><div class="seg" data-option="shape"><button data-value="plate">Plate</button><button data-value="round">Punch</button><button data-value="wedge">Wedge</button><button data-value="crosswedge">Cross</button><button data-value="dome">Dome</button></div></div>
      <div class="pressRow"><span>Size</span><div class="seg" data-option="size"><button data-value="0.6">S</button><button data-value="1">M</button><button data-value="1.4">L</button></div></div>
      <div class="pressRow pressActions">
        <button id="pressAction" class="primary">Crush</button>
        <button id="pressStop" hidden>Stop</button>
        <button id="pressRemove" hidden>Remove</button>
        <output id="pressReadout"></output>
      </div>
    </section>
    <div id="renderFrame" hidden></div>
    <output id="renderReadout" hidden></output>
    <section id="renderPanel" aria-label="Render" hidden>
      <div class="pressRow"><span>Samples</span><div class="seg" data-option="samples"><button data-value="64">64</button><button data-value="512">512</button><button data-value="2048">2048</button></div></div>
      <div class="pressRow"><span>Size</span><div class="seg" data-option="size"><button data-value="screen">Screen</button><button data-value="1080p">1080p</button><button data-value="1440p">1440p</button><button data-value="4k">4K</button></div></div>
      <div class="pressRow"><span>View</span><div class="viewButtons"><button id="viewSave">Save view</button><button id="viewLoad" hidden>Load view</button></div></div>
      <div class="pressRow" id="denoiseRow"><span>Denoise</span><div class="seg" data-option="denoise"><button data-value="off">Off</button><button data-value="on">On</button></div></div>
      <div class="pressRow pressActions">
        <button id="renderGo" class="primary">Render</button>
        <button id="renderSave" hidden>Save PNG</button>
        <button id="renderBack" hidden>Back</button>
      </div>
      <div id="renderProgress" hidden><span></span></div>
    </section>
    <div id="labels"></div>
    <div id="tip" hidden></div>
  </body>
</html>
